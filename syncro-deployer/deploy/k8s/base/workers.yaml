apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-workers
  namespace: aegisops
  labels:
    app: aegisops-workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisops-workers
  template:
    metadata:
      labels:
        app: aegisops-workers
    spec:
      serviceAccountName: aegisops-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/aegisops/control-plane:0.1.0
          command: ["python", "-m", "aegisops.workers.runner"]
          securityContext:
            privileged: false
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-drift-scanner
  namespace: aegisops
  labels:
    app: go-drift-scanner
    aegis.dev/tier: extension
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-drift-scanner
  template:
    metadata:
      labels:
        app: go-drift-scanner
        aegis.dev/tier: extension
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: go-drift-scanner
          image: ghcr.io/aegisops/go-drift-scanner:0.1.0
          ports:
            - containerPort: 9101
          securityContext:
            privileged: false
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: go-drift-scanner
  namespace: aegisops
spec:
  selector:
    app: go-drift-scanner
  ports:
    - port: 9101
      targetPort: 9101
