apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisops-control-plane
  namespace: aegisops
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegisops-workload-launcher
  namespace: aegisops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegisops-workload-launcher-binding
  namespace: aegisops
subjects:
  - kind: ServiceAccount
    name: aegisops-control-plane
    namespace: aegisops
roleRef:
  kind: Role
  name: aegisops-workload-launcher
  apiGroup: rbac.authorization.k8s.io
