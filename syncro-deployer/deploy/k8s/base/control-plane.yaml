apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisops-control-plane
  namespace: aegisops
  labels:
    app: aegisops-control-plane
    aegis.dev/tier: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisops-control-plane
  template:
    metadata:
      labels:
        app: aegisops-control-plane
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: aegisops-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/aegisops/control-plane:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AEGIS_MODE
              value: "live"
            - name: AEGIS_BROKER_BACKEND
              value: "live"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "aegis-kafka:9092"
            - name: RABBITMQ_URL
              value: "amqp://aegis@aegis-rabbitmq:5672/aegis"
            - name: REDIS_URL
              value: "redis://aegis-redis:6379/0"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            privileged: false
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aegisops-control-plane
  namespace: aegisops
spec:
  selector:
    app: aegisops-control-plane
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegisops-control-plane-hpa
  namespace: aegisops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegisops-control-plane
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegisops-control-plane-pdb
  namespace: aegisops
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aegisops-control-plane
