apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aegisops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-mesh
  namespace: aegisops
spec:
  podSelector:
    matchLabels:
      app: aegisops-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              aegis.dev/tier: broker
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              aegis.dev/tier: extension
      ports:
        - protocol: TCP
          port: 9101
        - protocol: TCP
          port: 9102
        - protocol: TCP
          port: 9103
