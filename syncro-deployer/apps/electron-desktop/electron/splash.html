<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Syncro Deployer</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #0d1117; color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid; place-items: center;
        border: 1px solid #26303d;
        border-radius: 10px;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card { text-align: center; padding: 24px 32px; }
      svg { width: 46px; height: 46px; color: #22a8bd; margin-bottom: 14px; }
      h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
      p { font-size: 12px; color: #8b949e; font-family: ui-monospace, SFMono-Regular, monospace; }
      .bar { width: 180px; height: 3px; background: #1d2631; border-radius: 2px; margin: 16px auto 0; overflow: hidden; }
      .bar::after {
        content: ""; display: block; width: 45%; height: 100%; background: #22a8bd;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <polygon points="16,3 27,9.5 27,22.5 16,29 5,22.5 5,9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
        <polygon points="16,8 22.5,11.8 22.5,20.2 16,24 9.5,20.2 9.5,11.8" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.2" />
        <circle cx="16" cy="16" r="2.6" fill="currentColor" />
      </svg>
      <h1>Syncro Deployer</h1>
      <p>Initializing Control Plane &amp; Cloud CLI MCP...</p>
      <div class="bar"></div>
    </div>
  </body>
</html>
