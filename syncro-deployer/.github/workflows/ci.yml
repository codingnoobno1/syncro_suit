name: Polyglot DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  python-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install and verify Python control plane
        working-directory: services/control-plane
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/ruff check src tests
          .venv/bin/mypy src
          .venv/bin/pytest -v
      - name: Run AegisOps DevSecOps Self-Scan (SARIF)
        working-directory: services/control-plane
        run: |
          .venv/bin/aegis scan --project aegisops --target ../../infra --sarif > ../../aegis-sarif.json

  go-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: extensions/go-drift-scanner
        run: |
          go vet ./...
          go test -v -race ./...

  typescript-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: extensions/ts-policy-webhook
        run: |
          npm ci || npm install
          npm run build
          npm test

  java-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: extensions/java-audit-bridge
        run: mvn -B test

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/dashboard
        run: |
          npm ci || npm install
          npm run build

  flutter-desktop-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - working-directory: apps/syncro-desktop
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

