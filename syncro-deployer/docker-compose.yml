services:
  # ============================================================================
  # Tri-Broker Fabric: Apache Kafka (KRaft) + RabbitMQ + Redis
  # ============================================================================
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: aegis
      RABBITMQ_DEFAULT_PASS: aegis-dev-pass
      RABBITMQ_DEFAULT_VHOST: aegis
    volumes:
      - ./configs/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  opa:
    image: openpolicyagent/opa:0.69.0
    ports:
      - "8181:8181"
    command: ["run", "--server", "--addr", ":8181", "/policies"]
    volumes:
      - ./policies/opa:/policies:ro

  # ============================================================================
  # AegisOps Control Plane + Async Workers + MCP HTTP Host
  # ============================================================================
  control-plane:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AEGIS_MODE: simulation
      AEGIS_BROKER_BACKEND: live
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://aegis:aegis-dev-pass@rabbitmq:5672/aegis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - kafka
      - rabbitmq
      - redis
      - opa

  workers:
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
    command: ["python", "-m", "aegisops.workers.runner"]
    environment:
      AEGIS_MODE: simulation
      AEGIS_BROKER_BACKEND: live
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://aegis:aegis-dev-pass@rabbitmq:5672/aegis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - kafka
      - rabbitmq
      - redis

  # ============================================================================
  # Polyglot Extensions (Go + TypeScript + Java 17)
  # ============================================================================
  go-drift-scanner:
    build:
      context: extensions/go-drift-scanner
    ports:
      - "9101:9101"

  ts-policy-webhook:
    build:
      context: extensions/ts-policy-webhook
    ports:
      - "9102:9102"

  java-audit-bridge:
    build:
      context: extensions/java-audit-bridge
    ports:
      - "9103:9103"

  # ============================================================================
  # Command Center Dashboard & Observability
  # ============================================================================
  dashboard:
    build:
      context: apps/dashboard
    ports:
      - "5173:80"
    depends_on:
      - control-plane

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
