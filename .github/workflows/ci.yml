name: Polyglot DevSecOps & Electron CI

on:
  push:
    branches: [main, electron-frontend]
  pull_request:

permissions:
  contents: read

jobs:
  python-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Verify Python Control Plane & az/gcloud/aws CLI MCP
        working-directory: syncro-deployer/services/control-plane
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/ruff check src tests
          .venv/bin/mypy src
          .venv/bin/pytest -v

  electron-frontend-and-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native .so, Vite renderer, and run Electron smoke tests
        working-directory: syncro-deployer/apps/electron-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm install
          bash native/build-native.sh
          npm run build
          npm test

  go-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: syncro-deployer/extensions/go-drift-scanner
        run: |
          go vet ./...
          go test -v -race ./...

  typescript-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: syncro-deployer/extensions/ts-policy-webhook
        run: |
          npm ci || npm install
          npm run build
          npm test

  java-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - working-directory: syncro-deployer/extensions/java-audit-bridge
        run: |
          mkdir -p target/classes
          javac -d target/classes src/main/java/io/aegisops/audit/*.java
          java -cp target/classes io.aegisops.audit.AuditBridgeApplication --self-test

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: syncro-deployer/apps/dashboard
        run: |
          npm ci || npm install
          npm run build
